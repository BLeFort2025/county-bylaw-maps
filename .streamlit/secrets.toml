# ── SMTP configuration for password reset emails ──
# Used by the Admin page "Forgot Password?" feature.
#
# For Microsoft 365 / Outlook:
#   server   = "smtp.office365.com"
#   port     = 587
#   username = "your-email@ofa.on.ca"
#   password = "your-app-password"
#
# To generate an App Password for Microsoft 365:
#   1. Go to https://mysignins.microsoft.com/security-info
#   2. Click "Add sign-in method" → "App password"
#   3. Copy the generated password below
#
# For Gmail:
#   server   = "smtp.gmail.com"
#   port     = 587

[smtp]
server   = "smtp.office365.com"
port     = 587
username = "ben.lefort@ofa.on.ca"
password = "REPLACE_WITH_APP_PASSWORD"
